# aiformeaning.com — shared-edge virtual host, STAGE 2 (HTTPS, canonical apex).
#
# Installed at /srv/edge/nginx/conf.d/aiformeaning.com.conf by `aiformeaning-edge enable-tls` after the
# certificate exists at /etc/letsencrypt/live/aiformeaning.com inside the edge container.
# Nothing in the shared nginx.production.conf is modified; this file is included by its
# `include /etc/nginx/edge.d/*.conf`.

# Only the small API is rate-limited at the edge; the application rate-limits it too.
limit_req_zone $binary_remote_addr zone=aiformeaning_api:10m rate=60r/m;

# http://aiformeaning.com, http://www.aiformeaning.com → https://aiformeaning.com (ACME excepted)
server {
    listen 80;
    listen [::]:80;
    server_name aiformeaning.com www.aiformeaning.com;
    access_log off;
    error_log /var/log/nginx/aiformeaning.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot;
    }

    location / {
        return 301 https://aiformeaning.com$request_uri;
    }
}

# https://www.aiformeaning.com → https://aiformeaning.com
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.aiformeaning.com;

    ssl_certificate     /etc/letsencrypt/live/aiformeaning.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aiformeaning.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:aiformeaning_ssl:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    access_log off;
    error_log /var/log/nginx/aiformeaning.error.log warn;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://aiformeaning.com$request_uri;
}

# https://aiformeaning.com → the application
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aiformeaning.com;

    ssl_certificate     /etc/letsencrypt/live/aiformeaning.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aiformeaning.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:aiformeaning_ssl:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Privacy: no access log for this site. Errors only (these may include a client address for a
    # failed request; the edge rotates its logs). See docs/PRIVACY_ARCHITECTURE.md.
    access_log off;
    error_log /var/log/nginx/aiformeaning.error.log warn;

    client_max_body_size 64k;

    # The shared edge sets `limit_conn perip 20` for every site; HTTP/2 page loads fetch many chunks
    # in parallel, so this host allows more concurrent streams per visitor.
    limit_conn perip 64;

    # If the application is unreachable (restarting, stopped), answer calmly instead of a bare 502.
    error_page 502 503 504 = @aiformeaning_unavailable;
    location @aiformeaning_unavailable {
        default_type text/html;
        add_header Retry-After 30 always;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        return 503 '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI for Meaning</title><body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#09091A;color:#F4F0E9;font-family:Georgia,serif;text-align:center;padding:24px"><div><h1 style="font-weight:400">A quiet moment.</h1><p style="color:#ADA6C2;font-family:system-ui,sans-serif">The site is briefly unavailable. Please try again shortly.</p><p style="color:#8A84AA;font-family:system-ui,sans-serif;font-size:14px">If you may be in danger, contact your local emergency number.</p></div></body></html>';
    }

    # Declaring add_header here stops the edge's http-level headers (another project's CSP) from being
    # inherited. The application sets its own security headers and per-request CSP; the edge adds
    # only HSTS, which must never be sent over plain HTTP in development.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json application/xml;

    resolver 127.0.0.11 valid=30s ipv6=off;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot;
    }

    location ^~ /_next/static/ {
        set $aiformeaning_upstream aiformeaning-web:3000;
        proxy_pass http://$aiformeaning_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ^~ /api/ {
        limit_req zone=aiformeaning_api burst=20 nodelay;
        limit_req_status 429;
        set $aiformeaning_upstream aiformeaning-web:3000;
        proxy_pass http://$aiformeaning_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        set $aiformeaning_upstream aiformeaning-web:3000;
        proxy_pass http://$aiformeaning_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_intercept_errors off;
    }
}
