# aiformeaning.com — shared-edge virtual host, STAGE 1 (HTTP only, before a certificate exists).
#
# Installed at /srv/edge/nginx/conf.d/aiformeaning.com.conf by deploy/server/aiformeaning-edge.
# Serves ACME HTTP-01 challenges from the edge's webroot and proxies everything else to the app so
# the site can be checked over HTTP while DNS propagates. Replaced by the HTTPS config (stage 2)
# once the certificate has been issued.

server {
    listen 80;
    listen [::]:80;
    server_name aiformeaning.com www.aiformeaning.com;

    # Privacy: no access log for this site (see docs/PRIVACY_ARCHITECTURE.md).
    access_log off;
    error_log /var/log/nginx/aiformeaning.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot;
    }

    location / {
        # Variable upstream + Docker DNS: resolved per request, so if this app is stopped the shared
        # edge still starts and every other site keeps working.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $aiformeaning_upstream aiformeaning-web:3000;
        proxy_pass http://$aiformeaning_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
