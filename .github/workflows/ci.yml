name: CI

on:
  pull_request:
  push:
    branches: ['build/**']
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, unit tests, build, E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and component tests
        run: pnpm test

      - name: Dependency audit (production, high+)
        run: pnpm audit --prod --audit-level high

      - name: Build
        run: pnpm build
        env:
          APP_VERSION: ${{ github.run_number }}
          GIT_COMMIT: ${{ github.sha }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: End-to-end tests (Chromium desktop + mobile)
        run: pnpm test:e2e

      - name: Cross-browser smoke (Firefox, WebKit)
        run: pnpm exec playwright test --project=firefox --project=webkit

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
